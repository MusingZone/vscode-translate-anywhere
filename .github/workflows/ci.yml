name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/core.test.js
      - run: node tools/package.js --lite-only --target win32-x64
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: dist/*.vsix